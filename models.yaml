# Published model weights, pinned by revision.
#
# `revision` is a Hugging Face commit sha, not a branch. Pinning it means a
# download today and a download in two years give byte-identical weights, even
# if the repo gains a new release. Bump it deliberately, never to "main".
#
#   python download_weights.py              # everything below
#   python download_weights.py --model fe4_nnunet --dest /path/to/nnUNet_results

models:

  fe4_nnunet:
    repo_id: yokko123/ctp-core-penumbra-nnunet
    revision: dbd2364cc18c7e820d666a5db5b0bc09586086b2
    repo_type: model
    description: >-
      3D nnU-Net, 5-fold ensemble, core/penumbra segmentation from 40-channel
      admission CTP. Trained on Dataset1152_SUS_CTP_Reg_3DT.
    # Where the files land. nnU-Net expects this to be $nnUNet_results, with the
    # dataset/trainer directories directly underneath.
    dest_env: nnUNet_results
    dest_default: ./weights/nnUNet_results
    # Guards against a silently truncated or partial download.
    expect_files:
      config.json: 1225
      Dataset1152_SUS_CTP_Reg_3DT/nnUNetTrainer__nnUNetPlans__3d_fullres/fold_0/checkpoint_final.pth: 357035375
      Dataset1152_SUS_CTP_Reg_3DT/nnUNetTrainer__nnUNetPlans__3d_fullres/fold_1/checkpoint_final.pth: 357135599
      Dataset1152_SUS_CTP_Reg_3DT/nnUNetTrainer__nnUNetPlans__3d_fullres/fold_2/checkpoint_final.pth: 357085103
      Dataset1152_SUS_CTP_Reg_3DT/nnUNetTrainer__nnUNetPlans__3d_fullres/fold_3/checkpoint_final.pth: 356950959
      Dataset1152_SUS_CTP_Reg_3DT/nnUNetTrainer__nnUNetPlans__3d_fullres/fold_4/checkpoint_final.pth: 356947631
      Dataset1152_SUS_CTP_Reg_3DT/nnUNetTrainer__nnUNetPlans__3d_fullres/plans.json: 25678
      Dataset1152_SUS_CTP_Reg_3DT/nnUNetTrainer__nnUNetPlans__3d_fullres/dataset.json: 1570

  fe3_mjnet:
    repo_id: yokko123/ctp-core-penumbra-mjnet
    revision: 6271cd82bbf8d7fc65a518b4d08db9927cb218db
    repo_type: model
    description: >-
      mJ-Net 2D+time CNN, 5-fold ensemble, core/penumbra segmentation from
      16x16x40 CTP patches. Released for its 256-D encoder bottleneck (FE3);
      its segmentation quality is poor by comparison with fe4_nnunet.
    dest_env: MJNET_CHECKPOINT_DIR
    dest_default: ./weights/mjnet
    expect_files:
      config.json: 1042
      README.md: 9606
      arch_mJNet.py: 17622
      predict.py: 9983
      folds/fold_0.pt: 3935366
      folds/fold_1.pt: 3935366
      folds/fold_2.pt: 3935366
      folds/fold_3.pt: 3935366
      folds/fold_4.pt: 3935366
